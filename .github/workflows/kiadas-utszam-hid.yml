# Az útszámkereső-híd feltöltése a tárhelyre.
#
# MIÉRT KELL EZ
#
# A híd egyetlen PHP-fájl (utvonalbejaras/kiszolgalo/utszam.php). PHP-t a
# GitHub Pages NEM futtat, ezért ennek a fájlnak a cPanel-es tárhelyre kell
# kerülnie — ugyanoda, ahol az atlagsebesseg.hu is fut. Ez a munkafolyamat
# ezt a lépést veszi át: ha a fájl változik, magától felmegy FTP-n.
#
# BEÁLLÍTÁS
#
# Ugyanazokat a titkokat használja, mint az átlagsebesség kiadása
# (Settings → Secrets and variables → Actions):
#
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#
# HOVA KERÜL
#
# Oda, ahol az atlagsebesseg.hu fájljai is vannak — mert arról a mappáról
# biztosan tudjuk, hogy a webről elérhető. A híd címe így:
#
#   https://atlagsebesseg.hu/utszam.php
#
# Ezt kell beírni az appban: kezdőképernyő → Útszámkereső-híd. Ha máshová
# szeretnéd (pl. a fiók fődomainjének gyökerébe), írd át a SERVER_DIR-t
# „/public_html/”-re — akkor a cím a fődomain szerinti lesz.

name: Kiadás a tárhelyre (útszámkereső-híd)

on:
  push:
    branches: [main]
    paths:
      - 'utvonalbejaras/kiszolgalo/**'
      - '.github/workflows/kiadas-utszam-hid.yml'
  # Kézzel is indítható a repó Actions fülén.
  workflow_dispatch:

concurrency:
  group: kiadas-utszam-hid
  cancel-in-progress: false

env:
  # Az FTP-gyökérhez képest. cPanelnél a bejelentkezés /home/<fiók>-ba
  # érkezik, az oldal pedig a public_html alatt van.
  SERVER_DIR: /public_html/atlagsebesseg/

jobs:
  kiadas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Titkok ellenőrzése
        id: titkok
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "van=nem" >> "$GITHUB_OUTPUT"
            echo "::notice::Az FTP-titkok nincsenek beállítva, a feltöltés kimarad."
          else
            echo "van=igen" >> "$GITHUB_OUTPUT"
          fi

      - name: Feltöltendő csomag összeállítása
        if: steps.titkok.outputs.van == 'igen'
        run: |
          set -euo pipefail
          mkdir -p kiadas
          cp utvonalbejaras/kiszolgalo/utszam.php kiadas/utszam.php
          echo "Feltöltendő: $(find kiadas -type f | wc -l) fájl"

      - name: Feltöltés FTP-n
        if: steps.titkok.outputs.van == 'igen'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./kiadas/
          server-dir: ${{ env.SERVER_DIR }}
          state-name: .utszam-hid-allapot.json
          dangerous-clean-slate: false
