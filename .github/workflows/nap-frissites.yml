# Az országos NAP-adatok frissítése (szelvényjelek + szakaszos rétegek).
#
# A NAP (napportal.kozut.hu) statikus adatcsomagjai hetente frissülnek. Az
# app a `utvonalbejaras/adatok/szelvenyjelek.json` állományból dolgozik —
# ez a munkafolyamat állítja elő. A felhasználóknak így semmit nem kell
# letölteniük vagy betölteniük.
#
# HÁROM MÓDON INDULHAT
#
# 1. HETENTE MAGÁTÓL — ehhez kell egy közvetlen letöltési cím:
#
#      Settings → Secrets and variables → Actions → New repository secret
#        NAP_SZELVENY_URL   a szelvényjelek adatcsomag letöltési címe
#        NAP_FEJLEC         (ha kell) pl. "Authorization: Bearer ..."
#
#    A portál oldalai (…/#/configuration/data-provider/profile/91)
#    bejelentkezést kérnek, és nem fájlra mutatnak. A valódi letöltési cím
#    a feliratkozás után jelenik meg: azon jobb gomb → „Hivatkozás címének
#    másolása”. Ha az nem nyilvános, hagyjuk üresen a titkot, és marad a
#    2. vagy a 3. mód.
#
# 2. KÉZI FELTÖLTÉSSEL (bejelentkezés nélkül nem megy másképp):
#
#    Töltsd le a portálról a szelvényjelek csomagot, és tedd be ide a
#    tárolóba ZIP-ként (a .shp és a .dbf legyen benne):
#
#      utvonalbejaras/nap-nyers/szelvenyjelek.zip
#
#    A GitHub webes felületén is megy: Add file → Upload files. A ZIP pár
#    száz kilobájt. Feltöltés után ez a munkafolyamat magától lefut,
#    átalakítja, és frissíti az app adatát.
#
# 3. KÉZZEL INDÍTVA, egy beírt címmel: Actions → ez a munkafolyamat →
#    Run workflow → a „cim” mezőbe beillesztve a letöltési link.
#
# Az adat a Nemzeti Adathozzáférési Pont (NAP) szolgáltatása, CC BY 4.0
# licenc alatt. A forrásmegjelölés az appban és a jegyzőkönyvekben szerepel.

name: NAP szelvényadat frissítése

on:
  schedule:
    # hetente egyszer, kedd hajnalban (a NAP heti frissítése után)
    - cron: '17 3 * * 2'
  push:
    branches: [main]
    paths:
      - 'utvonalbejaras/nap-nyers/**'
  workflow_dispatch:
    inputs:
      cim:
        description: 'Letöltési cím (ha üres, a NAP_SZELVENY_URL titkot használja)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  frissites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Forrás kiválasztása
        id: forras
        env:
          CIM_INPUT: ${{ github.event.inputs.cim }}
          CIM_SECRET: ${{ secrets.NAP_SZELVENY_URL }}
        run: |
          set -euo pipefail
          CIM="${CIM_INPUT:-$CIM_SECRET}"
          if [ -n "$CIM" ]; then
            echo "mod=letoltes" >> "$GITHUB_OUTPUT"
            echo "cim=$CIM" >> "$GITHUB_OUTPUT"
          elif ls utvonalbejaras/nap-nyers/* >/dev/null 2>&1; then
            echo "mod=helyi" >> "$GITHUB_OUTPUT"
          else
            echo "Nincs letöltési cím és nincs feltöltött csomag — kimarad."
            echo "mod=nincs" >> "$GITHUB_OUTPUT"
          fi

      - name: Letöltés
        if: steps.forras.outputs.mod == 'letoltes'
        env:
          CIM: ${{ steps.forras.outputs.cim }}
          FEJLEC: ${{ secrets.NAP_FEJLEC }}
        run: |
          set -euo pipefail
          mkdir -p munka
          if [ -n "${FEJLEC:-}" ]; then
            curl -fsSL -H "$FEJLEC" -o munka/csomag "$CIM"
          else
            curl -fsSL -o munka/csomag "$CIM"
          fi

      - name: Feltöltött csomag átvétele
        if: steps.forras.outputs.mod == 'helyi'
        run: |
          set -euo pipefail
          mkdir -p munka
          cp utvonalbejaras/nap-nyers/* munka/
          ls -la munka

      - name: Átalakítás
        if: steps.forras.outputs.mod != 'nincs'
        run: |
          set -euo pipefail
          cd munka
          for f in *; do
            if [ "$(file -b --mime-type "$f")" = "application/zip" ]; then
              unzip -o "$f"
            fi
          done
          BE=$(ls *.shp 2>/dev/null | head -1 || true)
          [ -n "$BE" ] || BE=$(ls *.geojson *.json 2>/dev/null | head -1 || true)
          if [ -z "$BE" ]; then
            echo "A csomagban nincs .shp és nincs GeoJSON." >&2
            ls -la
            exit 1
          fi
          cd ..
          node utvonalbejaras/eszkozok/nap-szelvenyek.mjs "munka/$BE"
          # A többi NAP-réteg (hidak, korlátozások, burkolat, sávszám,
          # lakott területi szakaszok, kezelő) egy másik állományba kerül.
          # Ha ezek nincsenek a csomagban, a meglévő adat marad.
          node utvonalbejaras/eszkozok/nap-szakaszadatok.mjs munka

      - name: Commit, ha változott
        if: steps.forras.outputs.mod != 'nincs'
        run: |
          set -euo pipefail
          if git diff --quiet -- utvonalbejaras/adatok/; then
            echo "Nem változott az adat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utvonalbejaras/adatok/
          git commit -m "NAP adatok frissítése ($(date +%Y-%m-%d))"
          git push
