# Az utvonalbejaras.hu automatikus kiadása a GitHub Pages-re.
#
# MIÉRT KELL EZ
#
# Alapból a Pages az egész repót közzéteszi, ezért az app a
# /utvonalbejaras/ alkönyvtárba kerülne — a domain gyökerében pedig a
# kétalkalmazásos nyitólap lenne. Ez a munkafolyamat ehelyett egy saját
# csomagot állít össze:
#
#   /                  ← az útvonalbejárás app (ez a www.utvonalbejaras.hu)
#   /atlagsebesseg/    ← a korábbi címek is működnek tovább
#
# Így a fotók feliratán szereplő cím pontosan oda visz, ahová kell, és a
# `git push` után pár perccel már az éles oldal frissül — külön feltöltés
# nélkül.
#
# EGYSZERI BEÁLLÍTÁS A REPÓBAN
#
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Pages → Custom domain: www.utvonalbejaras.hu
#   Settings → Pages → Enforce HTTPS: bekapcsolva (a tanúsítvány pár
#                      percen belül magától elkészül)
#
# A domain szolgáltatójánál (ahol a nevet vetted):
#
#   www   CNAME   keresohirdetesek-afk.github.io.
#   @     A       185.199.108.153
#   @     A       185.199.109.153
#   @     A       185.199.110.153
#   @     A       185.199.111.153
#
# (Az apex A-rekordok ahhoz kellenek, hogy a www nélküli cím is működjön.
# A pontos értékeket a Settings → Pages oldal is kiírja.)

name: Kiadás a Pages-re (utvonalbejaras.hu)

on:
  push:
    branches: [main]
  # Kézzel is indítható a repó Actions fülén.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy kiadás fusson; a frissebb előzze meg a régebbit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  csomag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Közzétehető csomag összeállítása
        run: |
          set -euo pipefail
          mkdir -p _site
          # az app a gyökérbe
          cp -r utvonalbejaras/. _site/
          # ami csak a fejlesztéshez kell, az maradjon a repóban
          rm -rf _site/eszkozok
          # a kiszolgalo/ mappa PHP-t tartalmaz, amit a Pages nem futtat —
          # az a saját tárhelyre való, nem ide
          rm -rf _site/kiszolgalo
          rm -f _site/build-single.mjs _site/README.md
          # a másik alkalmazás a korábbi útvonalán
          if [ -d atlagsebesseg ]; then
            mkdir -p _site/atlagsebesseg
            cp -r atlagsebesseg/. _site/atlagsebesseg/
            rm -rf _site/atlagsebesseg/teszt _site/atlagsebesseg/media
            find _site/atlagsebesseg -name '*.md' -delete
          fi
          # a Jekyll-feldolgozás kihagyása (a _ kezdetű nevek miatt kell)
          touch _site/.nojekyll
          # A saját domain neve. A Settings → Pages → Custom domain mentésekor
          # a GitHub a repó gyökerébe írja a CNAME fájlt — azt vesszük át, hogy
          # a beállítás és a közzétett csomag ne mondhasson mást. (Ha nincs,
          # marad az alapértelmezett.)
          if [ -f CNAME ]; then
            cp CNAME _site/CNAME
          else
            echo "www.utvonalbejaras.hu" > _site/CNAME
          fi
          echo "Domain: $(cat _site/CNAME)"
          echo "Közzétett fájlok: $(find _site -type f | wc -l)"

      # A sw.js gyorsítótárnevének minden kiadásnál emelkednie kell,
      # különben a már telepített alkalmazásokban a régi fájlok maradnak.
      # Ez csak figyelmeztet, nem állítja meg a kiadást.
      - name: Gyorsítótárnév ellenőrzése
        run: |
          UJ=$(grep -o "utvonalbejaras-v[0-9]*" utvonalbejaras/sw.js | head -1)
          REGI=$(git show HEAD~1:utvonalbejaras/sw.js 2>/dev/null \
                 | grep -o "utvonalbejaras-v[0-9]*" | head -1 || echo "")
          echo "Gyorsítótár: ${REGI:-?} -> $UJ"
          if [ -n "$REGI" ] && [ "$REGI" = "$UJ" ]; then
            echo "::warning::A sw.js gyorsítótárneve nem változott ($UJ). A már telepített alkalmazások a régi fájlokat tarthatják meg."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  kiadas:
    needs: csomag
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
