<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Útvonalbejárás">
  <title>Útvonalbejárás</title>
  <defs>
    <!-- figyelmeztető csíkozás, mint a túlméretes szállítmány kíséretén -->
    <pattern id="ub-stripes" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="64" height="64" fill="#111827"/>
      <rect width="32" height="64" fill="#f59e0b"/>
    </pattern>
    <clipPath id="ub-frame">
      <path d="M128 8h256a120 120 0 0 1 120 120v256a120 120 0 0 1-120 120H128A120 120 0 0 1 8 384V128A120 120 0 0 1 128 8z"/>
    </clipPath>
  </defs>

  <!-- aszfalt alap -->
  <path d="M128 8h256a120 120 0 0 1 120 120v256a120 120 0 0 1-120 120H128A120 120 0 0 1 8 384V128A120 120 0 0 1 128 8z" fill="#111827"/>

  <!-- csíkos keret: a külső és a belső lekerekített négyzet közötti gyűrű -->
  <g clip-path="url(#ub-frame)">
    <path fill-rule="evenodd" fill="url(#ub-stripes)" d="
      M128 8h256a120 120 0 0 1 120 120v256a120 120 0 0 1-120 120H128A120 120 0 0 1 8 384V128A120 120 0 0 1 128 8z
      M140 40h232a100 100 0 0 1 100 100v232a100 100 0 0 1-100 100H140A100 100 0 0 1 40 372V140A100 100 0 0 1 140 40z"/>
  </g>

  <!-- belső felület -->
  <path d="M140 40h232a100 100 0 0 1 100 100v232a100 100 0 0 1-100 100H140A100 100 0 0 1 40 372V140A100 100 0 0 1 140 40z" fill="#1f2937"/>

  <!-- az „U”: visszafordulás — a túlméretes szerelvény útvonala -->
  <path d="M186 150v118a70 70 0 0 0 140 0V196"
        fill="none" stroke="#d1d5db" stroke-width="44" stroke-linecap="round"/>

  <!-- az irány: nyíl a jobb száron fölfelé -->
  <path d="M326 136l46 74h-92z" fill="#f59e0b"/>

</svg>
