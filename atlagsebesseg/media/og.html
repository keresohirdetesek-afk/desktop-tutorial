<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Megosztási kép — 1200 × 630</title>
<style>
  /* A link-előnézet képe ugyanabból a rajzból készül, mint a
     Facebook-borító: egyetlen forrás, egyféle arculat. A borító
     1640 × 924 (16:9), a megosztási kép viszont 1200 × 630 (1,91:1),
     ezért a borítót kicsinyítve illesztjük bele.

       1200 / 1640 = 0,7317   →   924 * 0,7317 = 676 képpont magas
       676 - 630 = 46         →   23 képpont felül és alul lemarad

     A borítón minden lényeges elem a 150. és a 774. képpontsor között
     van; kicsinyítve és eltolva ez a 87–543. sor, tehát bőven belül. */
  * { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0e0e10; }
  .keret { width: 1200px; height: 630px; overflow: hidden; position: relative; }
  iframe {
    position: absolute;
    left: 0; top: -23px;
    width: 1640px; height: 924px;
    border: 0;
    transform: scale(0.7317073);
    transform-origin: 0 0;
  }
</style>
</head>
<body>
<div class="keret"><iframe src="borito.html" scrolling="no"></iframe></div>
</body>
</html>
