<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Átlagsebesség.hu">
  <title>Átlagsebesség.hu</title>
  <!-- A jelkép: perspektívában távolodó út, a szakasz két végén egy-egy
       helyjelölő tű, fölöttük a két pontot összekötő ív. Az ív bal fele
       tömör piros (a megtett rész), a jobb fele szaggatott (ami hátra
       van). Kevés elem, nagy formák: 16 képpontos favikonként is
       felismerhető marad.                                             -->
  <style>
    .ut    { fill: #1b1f24; }
    .csik  { fill: #ffffff; }
    .piros { fill: #e8332a; }
    .iv-piros { fill: none; stroke: #e8332a; stroke-width: 26; stroke-linecap: round; }
    .iv-sotet { fill: none; stroke: #1b1f24; stroke-width: 26; stroke-dasharray: 30 20; }
    /* Sötét böngészősávon a sötét út beleolvadna a háttérbe. */
    @media (prefers-color-scheme: dark) {
      .ut { fill: #f2f3f5; }
      .csik { fill: #1b1f24; }
      .iv-sotet { stroke: #f2f3f5; }
    }
  </style>

  <!-- út: lent széles, a horizont felé elkeskenyedő sáv -->
  <path class="ut" d="M78 452 C140 392 250 330 322 266 L348 266 C392 330 430 392 428 452 Z"/>

  <!-- felezővonal: a perspektíva miatt lefelé hosszabb és szélesebb -->
  <g class="csik">
    <path d="M331.0 272 L335.4 272 L329.0 296 L323.1 296 Z"/>
    <path d="M318.5 310 L325.3 310 L313.9 340 L305.1 340 Z"/>
    <path d="M297.8 356 L307.6 356 L295.0 392 L282.8 392 Z"/>
    <path d="M269.0 410 L282.3 410 L261.0 452 L245.0 452 Z"/>
  </g>

  <!-- a két végpontot összekötő ív -->
  <path class="iv-piros" d="M100 258 A161 161 0 0 1 238.2 141.4"/>
  <path class="iv-sotet" d="M271.8 141.4 A161 161 0 0 1 410 258"/>

  <!-- helyjelölő tűk: a szakasz eleje és vége -->
  <g class="piros">
    <path d="M71.5 308.8 A42 42 0 1 1 148.5 308.8 L110 397 Z"/>
    <path d="M361.5 308.8 A42 42 0 1 1 438.5 308.8 L400 397 Z"/>
  </g>
</svg>
